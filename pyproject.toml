[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurco-assistant"
version = "0.1.0"
description = "Grounded RAG assistant for Indicium InsurCo claims analysts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# Windows asyncio needs a localhost socketpair to build the event loop.
# Outbound hosts (the OpenAI API) stay blocked.
addopts = ["--disable-socket", "--allow-unix-socket", "--allow-hosts=127.0.0.1,::1"]
