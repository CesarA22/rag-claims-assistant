# Requirement register. Status is one of: done | partial | pending | cut.
# Differentials (D-01…D-05) are brief §3 optional items. Differentials do
# not compensate for missing mandatory requirements.
#
# Vocabulary rules (enforced by scripts/traceability.py):
#   cut     — notes MUST name the reason; a cut with no reason looks forgotten
#   partial — notes MUST name the remaining gap
#   done    — an R- row MUST have a non-empty tests list

requirements:
  - id: R-01
    title: Every answer cites its sources
    status: done
    files:
      - app/services/ask.py
      - app/domain/models.py
      - app/api/schemas.py
    tests: [T-01, T-02, T-13, T-14]

  - id: R-02
    title: Questions with no answer in the sources are refused
    status: partial
    session: S6
    files:
      - app/services/ask.py
    tests: [T-03, T-16, T-17]
    notes: "Invented-citation refusal (T-03) is in. Sufficiency and ambiguity judgment are not. S6 made the gap executable: T-16 (gs-008, on-topic non-answering evidence → refuse) and T-17 (gs-009, ambiguous question → needs_clarification) are written, were measured red against unmodified app/, and carry xfail(strict=True) so the marker fails CI the day the gate lands. Owed by S6b."

  - id: R-03
    title: Policyholder personal data never appears in an answer
    status: partial
    session: S6
    files:
      - app/safety/redact.py
      - app/retrieval/ingest.py
      - app/tools/claims.py
    tests: [T-04, T-15, T-18]
    notes: "Ingest-time redaction and query-layer exclusion (T-04) exist. T-18 (gs-010, corpus PII → refuse) is written, was measured red, and carries xfail(strict=True). Three egress paths are open, not one: ask.py never calls redact(); citation_from_evidence copies evidence.text into snippet unfiltered (and snippets are the entire degraded payload); and redact() matches CPF, phone and e-mail patterns only, so it cannot remove the five names gs-010 forbids. Owed by S6b."

  - id: R-04
    title: At most US$0.05 per question and p95 latency under 8 s
    status: done
    session: S5
    files:
      - app/services/budget.py
      - app/llm/resilient.py
      - app/llm/openai_provider.py
    tests: [T-29, T-32, T-34]
    notes: "Ceiling, min-retry-budget and max_output_tokens are enforced. p95 < 8s is a live-eval claim — T-32 stops us spending the tail, but the number itself is measured in EVALS.md."

  - id: R-05
    title: Bounded cost-aware retry and degradation
    status: done
    session: S5
    files:
      - app/llm/resilient.py
      - app/llm/chaos.py
      - app/services/ask.py
      - app/api/routes.py
    tests: [T-05, T-06, T-07, T-08, T-09, T-30, T-31, T-33]

  - id: R-06
    title: Client errors leak no internals
    status: done
    files:
      - app/api/errors.py
    tests: [T-10]

  - id: R-07
    title: Provider isolation
    status: done
    files:
      - app/llm/base.py
      - app/llm/fake.py
      - app/llm/openai_provider.py
      - app/llm/chaos.py
      - app/main.py
    tests: [T-11, T-28]

  - id: R-08
    title: Grounded, table-aware ingestion
    status: done
    files:
      - app/retrieval/ingest.py
      - app/safety/redact.py
    tests: [T-15]

  - id: R-09
    title: Hybrid retrieval with precedence filters
    status: done
    files:
      - app/retrieval/hybrid.py
      - app/retrieval/embeddings.py
      - app/storage/db.py
      - evals/retrieval_baseline.py
    tests: [T-19]

  - id: R-10
    title: Named, parameterised claims queries with PII excluded at the query layer
    status: done
    session: S4
    files:
      - app/tools/claims.py
    tests: [T-20, T-21, T-22, T-23, T-24, T-25, T-26]
    notes: "T-12 was reserved in S1 for a status='Pago' grep guard over app/tools/. S4 wrote that guard as part of T-22, which checks the QUERIES literals, walks app/**/*.py for the pattern, and asserts count_claims(status='Pago') raises InvalidRequest — a superset of the reservation. T-12 is therefore absorbed and intentionally unused; the gap in the ID sequence is not an omission."

  # Differentials — brief §3, "Diferenciais (opcionais)".
  # Verbatim note from the brief: "Differentials do not compensate for
  # missing mandatory requirements." Cut rows carry a reason; see DECISIONS.md.

  - id: D-01
    title: Streaming with progressive rendering
    source: "Challenge brief §3, Differentials"
    requirement: "Streaming of answers with progressive rendering. If implemented, handle the edges: error in the middle of the stream, cancellation by the user, interrupted response history."
    files: []
    tests: []
    status: pending
    notes: "First on the cut list. The three edge cases are the expensive part, not the stream."

  - id: D-02
    title: Idempotent retry
    source: "Challenge brief §3, Differentials"
    requirement: "Idempotent retry (repeating a question does not duplicate messages in the history)."
    files: [app/storage/memory.py, app/api/routes.py]
    tests: [T-02]
    status: done
    notes: "Landed in S1. client_message_id unique per conversation; begin_turn replays a completed turn."

  - id: D-03
    title: Docker Compose for the complete application
    source: "Challenge brief §3, Differentials"
    requirement: "Docker Compose to run the complete application."
    files: [docker-compose.yml]
    tests: []
    status: partial
    notes: "S3 added the db service only. app and web services are S8/S9 — 'complete' is not met yet."

  - id: D-04
    title: Authored evaluation cases
    source: "Challenge brief §3, Differentials"
    requirement: "Authorial evaluation cases in addition to the 10 provided."
    files: [evals/authored.json]
    tests: []
    status: pending
    notes: "S9. Five adversarial cases: PII bait, corpus prompt injection, stale-version trap, cross-product trap, absent answer."

  - id: D-05
    title: Provenance footer
    source: "Challenge brief §3, Differentials"
    requirement: "Provenance footer: each answer indicates which source it came from and the freshness of the queried data."
    files:
      - app/retrieval/hybrid.py
      - app/domain/models.py
      - app/services/ask.py
      - app/api/schemas.py
      - web/src/chat/Provenance.tsx
    tests: [T-27]
    status: pending
    notes: "S8. Render-only for the DB line, which reads from section + effective_date (T-26). The document line first needs page_from/page_to selected in hybrid.py and superseded + pages + source_kind added to Evidence, Citation and CitationOut. Citation does not yet carry superseded, page_from, page_to, source_kind or query_name."
