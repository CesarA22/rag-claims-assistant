  - id: R-09
    title: Hybrid retrieval with precedence filters
    status: done
    session: S7
    files:
      - app/retrieval/hybrid.py
      - app/retrieval/embeddings.py
      - app/storage/db.py
      - app/storage/models.py
      - app/storage/migrations/versions/0001_initial_schema.py
      - evals/retrieval_baseline.py
    tests: [T-19, T-40]
    notes: "S7a moved schema ownership from 001_chunks.sql to Alembic. T-40 is the guard that hand-writing revision 0001 required: it renders the migration offline (no connection) and asserts it agrees with models.py column-for-column, that chunks.tsv keeps its GENERATED ALWAYS AS clause and embedding stays vector(1536), and that citations.chunk_id carries no FK."

  - id: R-10
    title: Named, parameterised claims queries with PII excluded at the query layer
    status: partial
    session: S9
    files:
      - app/tools/claims.py
    tests: [T-20, T-21, T-22, T-23, T-24, T-25, T-26]
    notes: "S9 dropped this from done to partial. REMAINING GAP: the tool is unreachable from the product. app/services/ask.py contains no reference to app.tools and LLMProvider.complete has no tools parameter, so there is no plan/execute round trip; the only importers in the repo are tests/test_claims.py and scripts/gs007_from_db.py, the standalone script S4 wrote to answer gs-007 by hand. Golden case gs-007 fails on must_cite claims.get_claim_payment as a direct result (EVALS.md). The queries themselves are real, parameterised, LIMITed and PII-free at the projection, and T-20..T-26 pass. T-12 was reserved in S1 for a status='Pago' grep guard over app/tools/. S4 wrote that guard as part of T-22, which checks the QUERIES literals, walks app/**/*.py for the pattern, and asserts count_claims(status='Pago') raises InvalidRequest — a superset of the reservation. T-12 is therefore absorbed and intentionally unused; the gap in the ID sequence is not an omission."

  # Differentials — brief §3, "Diferenciais (opcionais)".
  # Verbatim note from the brief: "Differentials do not compensate for
  # missing mandatory requirements." Cut rows carry a reason; see DECISIONS.md.

  - id: D-01
    title: Streaming with progressive rendering
    source: "Challenge brief §3, Differentials"
    requirement: "Streaming of answers with progressive rendering. If implemented, handle the edges: error in the middle of the stream, cancellation by the user, interrupted response history."
    files: []
    tests: []
    status: pending
    notes: "First on the cut list. The three edge cases are the expensive part, not the stream."

  - id: D-02
    title: Idempotent retry
    source: "Challenge brief §3, Differentials"
    requirement: "Idempotent retry (repeating a question does not duplicate messages in the history)."
    files: [app/storage/memory.py, app/storage/sql.py, app/storage/models.py, app/api/routes.py, app/api/schemas.py, web/src/components/Chat.tsx]
    tests: [T-02, T-35, T-42]
    status: done
    session: S7
    notes: "S1 landed it in a per-process dict, which made it true at one worker only — two uvicorn workers each held their own, so the same client_message_id posted twice created two turns and two provider calls. S7b moved it to messages_client_idem UNIQUE (conversation_id, client_message_id) with INSERT ... ON CONFLICT DO NOTHING RETURNING, preserving the same three branches. T-35 runs against both repositories, including two racing begin_turn calls. S8a found the branch that made the frontend rule's Retry inert: begin_turn replayed any non-pending turn, so retrying a failed one returned the recorded failure at 200 with no provider call. A failed turn now re-opens in place — the key protects against duplicate ANSWERS, not against retrying a turn that produced none — and HistoryMessageOut returns client_message_id, which _turn() had always loaded and the API boundary had always dropped. Without that field a reloaded page mints a fresh key and duplicates the turn. T-42 asserts the retry POST body, not the rendering."

  - id: D-03
    title: Docker Compose for the complete application
    source: "Challenge brief §3, Differentials"
    requirement: "Docker Compose to run the complete application."
    files: [docker-compose.yml, Dockerfile, .dockerignore, .gitattributes, docker/entrypoint.sh, scripts/chunk_count.py, app/main.py]
    tests: [T-43, T-44]
    status: done
    session: S10
    notes: "S3 added the db service only. S8 declined the app and web services on the record — no Dockerfile, nothing serving static files — and re-pointed them at S9, which spent itself on the eval harness. S10 closes it with ONE Dockerfile and one service, not the two S8 estimated: the API is mounted at /api inside a shell that also serves the built client at /, so client and API share an origin and S8's decision to add no CORS middleware stays true in a deployment rather than only behind the Vite dev proxy. The plan's bare shell.mount() would have shipped a broken demo that looked healthy — Starlette does not route the lifespan scope into a mounted app, so create_app()'s startup hook never runs and state.retriever stays the two-chunk InMemoryRetriever; T-44 pins the forwarding and gs-009 returning ['Auto','Residencial'] from the container is the acceptance check, because that gate cannot fire against the in-memory fixture. Boot is idempotent: alembic upgrade head, ingest only when the chunk count is zero, serve. Verified from a git clone into an empty directory with no .env, no venv and no key: 43 seconds to healthy, 13 documents / 220 chunks, the three documented questions returning answered / needs_clarification / refused, and with LLM_PROVIDER=chaos the degraded and failed states too — all seven interface states reachable from compose alone. Two limits, both deliberate and recorded in DECISIONS.md: the container indexes with --no-embed so RETRIEVER_ARM is fixed at lexical, the arm EVALS.md tier 0 measures at recall@5 9/9 against a registered gate of 0.88, and there is no nginx service."

  - id: D-04
    title: Authored evaluation cases
    source: "Challenge brief §3, Differentials"
    requirement: "Authorial evaluation cases in addition to the 10 provided."
    files: [evals/authored.json, evals/boundary.py]
    tests: []
    status: done
    session: S9
    notes: "Five adversarial cases in evals/authored.json — PII bait, corpus prompt injection, stale-version trap, cross-product trap, absent answer — run by evals/boundary.py as five of the nine tier-3 cases. EVALS.md says plainly that these are the same five cases serving both D-04 and the boundary suite rather than two bodies of work. au-003 (stale-version) is the one miss and it is credit-blocked: its safety half passes, its content half needs a model that can answer."

  - id: D-05
    title: Provenance footer
    source: "Challenge brief §3, Differentials"
    requirement: "Provenance footer: each answer indicates which source it came from and the freshness of the queried data."
    files:
      - app/retrieval/hybrid.py
      - app/domain/models.py
      - app/services/ask.py
      - app/api/schemas.py
      - web/src/components/CitationList.tsx
    tests: [T-27]
    status: partial
    session: S8
    notes: "S8 took the page numbers only, because 40-frontend.mdc names 'page' in the citation panel. chunks.page_from/page_to were already populated, so it cost two columns in the outermost SELECT of hybrid.py — no ranking constant moved — plus the fields on Evidence, Citation and CitationOut. Nullable on Citation because sql.py rebuilds it field-by-field from a citations table that has no page columns; a required int would raise on every history read, and T-35 pins that. Remaining gap: superseded, source_kind and query_name on Citation, and the freshness line. A citation replayed from history shows no page."
