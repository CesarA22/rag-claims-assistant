# Requirement register. Status is one of: done | partial | pending | cut.
# Differentials (D-01…D-05) are brief §3 optional items. Differentials do
# not compensate for missing mandatory requirements.
#
# Vocabulary rules (enforced by scripts/traceability.py):
#   cut     — notes MUST name the reason; a cut with no reason looks forgotten
#   partial — notes MUST name the remaining gap
#   done    — an R- row MUST have a non-empty tests list

requirements:
  - id: R-01
    title: Every answer cites its sources
    status: done
    session: S7
    files:
      - app/services/ask.py
      - app/domain/models.py
      - app/api/schemas.py
      - app/api/routes.py
      - app/storage/sql.py
    tests: [T-01, T-02, T-13, T-14, T-36, T-37, T-40]
    notes: "S7c added GET /conversations/{id}/messages, which renders all five statuses including failed with its error_code — the reason `failed` has been in TurnStatus since S1. Distinct from recent_messages, which feeds the model and drops failed and pending; T-36 asserts the difference rather than leaving it to be rediscovered. T-37 pins the citation query as one SELECT."

  - id: R-02
    title: Questions with no answer in the sources are refused
    status: done
    session: S6b
    files:
      - app/services/ask.py
      - app/services/grounding.py
      - web/src/components/TurnCard.tsx
    tests: [T-03, T-16, T-17, T-41]
    notes: "S9 FINDING, unfixed and reported rather than patched: the sufficiency gate is unreachable for any question whose evidence spans more than one product, because judge() checks ambiguity first. Measured on gs-008 — evidence spans {Auto, Residencial, Empresarial}, the question names none, so is_ambiguous fires and the turn returns needs_clarification instead of refused. A model that refuses of its own accord still yields refused; a model that attempts an answer never reaches the sufficiency check. That inverts the architectural claim that refusal does not depend on trusting the model. The fix is a reordering plus a test pinning the order, and it gets its own commit. S6b landed both gates in app/services/grounding.py and the xfail markers came off. Sufficiency is lexical — the answer's content terms must appear in the evidence it cites, at or above SUFFICIENCY_MIN. It catches gs-008, where the answer names a subject (desconto) the cited text never mentions. It does not catch a fluent paraphrase that reuses the source's words to say something the source does not; that needs an entailment judgment and a second model call is not affordable inside the US$0.05 ceiling. Stated in DECISIONS.md rather than implied."

  - id: R-03
    title: Policyholder personal data never appears in an answer
    status: done
    session: S6b
    files:
      - app/safety/redact.py
      - app/retrieval/ingest.py
      - app/tools/claims.py
      - app/services/grounding.py
      - app/services/ask.py
      - app/llm/base.py
      - app/api/errors.py
    tests: [T-04, T-15, T-18]
    notes: "S6b closed all three egress paths S6 measured. A PII question over PII-bearing evidence is refused before a draft is considered (grounding.is_pii_request, keyed on contains_pii / doc_role which S2 populated and nothing read). citation_from_evidence redacts before truncating — the 240-char cut was chosen for layout and happened to cap the leak at two of five rows. The failure log now carries prompt_hash and evidence_ids, never prompt text, filtered at the handler as well as the formatter. redact() remains layer 2 only: it matches CPF, phone and e-mail patterns, so it cannot remove a name."

  - id: R-04
    title: At most US$0.05 per question and p95 latency under 8 s
    status: done
    session: S5
    files:
      - app/services/budget.py
      - app/llm/resilient.py
      - app/llm/openai_provider.py
    tests: [T-29, T-32, T-34]
    notes: "Ceiling, min-retry-budget and max_output_tokens are enforced. p95 < 8s is a live-eval claim — T-32 stops us spending the tail, but the number itself is measured in EVALS.md."

