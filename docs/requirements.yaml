# Requirement register. Status is one of: done | partial | pending | cut.
# Differentials (D-01…D-05) are brief §3 optional items. Differentials do
# not compensate for missing mandatory requirements.
#
# Vocabulary rules (enforced by scripts/traceability.py):
#   cut     — notes MUST name the reason; a cut with no reason looks forgotten
#   partial — notes MUST name the remaining gap
#   done    — an R- row MUST have a non-empty tests list

requirements:
  - id: R-01
    title: Every answer cites its sources
    status: done
    session: S7
    files:
      - app/services/ask.py
      - app/domain/models.py
      - app/api/schemas.py
      - app/api/routes.py
      - app/storage/sql.py
    tests: [T-01, T-02, T-13, T-14, T-36, T-37, T-40]
    notes: "S7c added GET /conversations/{id}/messages, which renders all five statuses including failed with its error_code — the reason `failed` has been in TurnStatus since S1. Distinct from recent_messages, which feeds the model and drops failed and pending; T-36 asserts the difference rather than leaving it to be rediscovered. T-37 pins the citation query as one SELECT."

  - id: R-02
    title: Questions with no answer in the sources are refused
    status: done
    session: S6b
    files:
      - app/services/ask.py
      - app/services/grounding.py
    tests: [T-03, T-16, T-17]
    notes: "S6b landed both gates in app/services/grounding.py and the xfail markers came off. Sufficiency is lexical — the answer's content terms must appear in the evidence it cites, at or above SUFFICIENCY_MIN. It catches gs-008, where the answer names a subject (desconto) the cited text never mentions. It does not catch a fluent paraphrase that reuses the source's words to say something the source does not; that needs an entailment judgment and a second model call is not affordable inside the US$0.05 ceiling. Stated in DECISIONS.md rather than implied."

  - id: R-03
    title: Policyholder personal data never appears in an answer
    status: done
    session: S6b
    files:
      - app/safety/redact.py
      - app/retrieval/ingest.py
      - app/tools/claims.py
      - app/services/grounding.py
      - app/services/ask.py
      - app/llm/base.py
      - app/api/errors.py
    tests: [T-04, T-15, T-18]
    notes: "S6b closed all three egress paths S6 measured. A PII question over PII-bearing evidence is refused before a draft is considered (grounding.is_pii_request, keyed on contains_pii / doc_role which S2 populated and nothing read). citation_from_evidence redacts before truncating — the 240-char cut was chosen for layout and happened to cap the leak at two of five rows. The failure log now carries prompt_hash and evidence_ids, never prompt text, filtered at the handler as well as the formatter. redact() remains layer 2 only: it matches CPF, phone and e-mail patterns, so it cannot remove a name."

  - id: R-04
    title: At most US$0.05 per question and p95 latency under 8 s
    status: done
    session: S5
    files:
      - app/services/budget.py
      - app/llm/resilient.py
      - app/llm/openai_provider.py
    tests: [T-29, T-32, T-34]
    notes: "Ceiling, min-retry-budget and max_output_tokens are enforced. p95 < 8s is a live-eval claim — T-32 stops us spending the tail, but the number itself is measured in EVALS.md."

  - id: R-05
    title: Bounded cost-aware retry and degradation
    status: done
    session: S5
    files:
      - app/llm/resilient.py
      - app/llm/chaos.py
      - app/services/ask.py
      - app/api/routes.py
    tests: [T-05, T-06, T-07, T-08, T-09, T-30, T-31, T-33]

  - id: R-06
    title: Client errors leak no internals
    status: done
    files:
      - app/api/errors.py
    tests: [T-10]

  - id: R-07
    title: Provider isolation
    status: done
    files:
      - app/llm/base.py
      - app/llm/fake.py
      - app/llm/openai_provider.py
      - app/llm/chaos.py
      - app/main.py
    tests: [T-11, T-28]

  - id: R-08
    title: Grounded, table-aware ingestion
    status: done
    files:
      - app/retrieval/ingest.py
      - app/safety/redact.py
    tests: [T-15]

  - id: R-09
    title: Hybrid retrieval with precedence filters
    status: done
    session: S7
    files:
      - app/retrieval/hybrid.py
      - app/retrieval/embeddings.py
      - app/storage/db.py
      - app/storage/models.py
      - app/storage/migrations/versions/0001_initial_schema.py
      - evals/retrieval_baseline.py
    tests: [T-19, T-40]
    notes: "S7a moved schema ownership from 001_chunks.sql to Alembic. T-40 is the guard that hand-writing revision 0001 required: it renders the migration offline (no connection) and asserts it agrees with models.py column-for-column, that chunks.tsv keeps its GENERATED ALWAYS AS clause and embedding stays vector(1536), and that citations.chunk_id carries no FK."

  - id: R-10
    title: Named, parameterised claims queries with PII excluded at the query layer
    status: done
    session: S4
    files:
      - app/tools/claims.py
    tests: [T-20, T-21, T-22, T-23, T-24, T-25, T-26]
    notes: "T-12 was reserved in S1 for a status='Pago' grep guard over app/tools/. S4 wrote that guard as part of T-22, which checks the QUERIES literals, walks app/**/*.py for the pattern, and asserts count_claims(status='Pago') raises InvalidRequest — a superset of the reservation. T-12 is therefore absorbed and intentionally unused; the gap in the ID sequence is not an omission."

  # Differentials — brief §3, "Diferenciais (opcionais)".
  # Verbatim note from the brief: "Differentials do not compensate for
  # missing mandatory requirements." Cut rows carry a reason; see DECISIONS.md.

  - id: D-01
    title: Streaming with progressive rendering
    source: "Challenge brief §3, Differentials"
    requirement: "Streaming of answers with progressive rendering. If implemented, handle the edges: error in the middle of the stream, cancellation by the user, interrupted response history."
    files: []
    tests: []
    status: pending
    notes: "First on the cut list. The three edge cases are the expensive part, not the stream."

  - id: D-02
    title: Idempotent retry
    source: "Challenge brief §3, Differentials"
    requirement: "Idempotent retry (repeating a question does not duplicate messages in the history)."
    files: [app/storage/memory.py, app/storage/sql.py, app/storage/models.py, app/api/routes.py]
    tests: [T-02, T-35]
    status: done
    session: S7
    notes: "S1 landed it in a per-process dict, which made it true at one worker only — two uvicorn workers each held their own, so the same client_message_id posted twice created two turns and two provider calls. S7b moved it to messages_client_idem UNIQUE (conversation_id, client_message_id) with INSERT ... ON CONFLICT DO NOTHING RETURNING, preserving the same three branches. T-35 runs against both repositories, including two racing begin_turn calls."

  - id: D-03
    title: Docker Compose for the complete application
    source: "Challenge brief §3, Differentials"
    requirement: "Docker Compose to run the complete application."
    files: [docker-compose.yml]
    tests: []
    status: partial
    notes: "S3 added the db service only. app and web services are S8/S9 — 'complete' is not met yet."

  - id: D-04
    title: Authored evaluation cases
    source: "Challenge brief §3, Differentials"
    requirement: "Authorial evaluation cases in addition to the 10 provided."
    files: [evals/authored.json]
    tests: []
    status: pending
    notes: "S9. Five adversarial cases: PII bait, corpus prompt injection, stale-version trap, cross-product trap, absent answer."

  - id: D-05
    title: Provenance footer
    source: "Challenge brief §3, Differentials"
    requirement: "Provenance footer: each answer indicates which source it came from and the freshness of the queried data."
    files:
      - app/retrieval/hybrid.py
      - app/domain/models.py
      - app/services/ask.py
      - app/api/schemas.py
      - web/src/chat/Provenance.tsx
    tests: [T-27]
    status: pending
    notes: "S8. Render-only for the DB line, which reads from section + effective_date (T-26). The document line first needs page_from/page_to selected in hybrid.py and superseded + pages + source_kind added to Evidence, Citation and CitationOut. Citation does not yet carry superseded, page_from, page_to, source_kind or query_name."
