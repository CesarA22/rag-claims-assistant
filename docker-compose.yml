services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: insurco
      POSTGRES_PASSWORD: insurco
      POSTGRES_DB: insurco
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurco -d insurco"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
